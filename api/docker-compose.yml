services:
  mysql:
    image: mysql:8.0
    container_name: costco-receipts-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dev_root_password
      MYSQL_DATABASE: costco_receipts
      MYSQL_USER: costco
      MYSQL_PASSWORD: dev_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdev_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
