# Local development database.
#
# MariaDB rather than MySQL, and the 11.8 series rather than an exact patch, to
# match the Pi: it runs 11.8.6-MariaDB from Debian and picks up patches through
# apt, so tracking the series here drifts the same way rather than pinning
# against it. If the Pi ever moves off 11.8, three places need updating
# together — this tag, Database:ServerVersion in appsettings.json, and
# MARIADB_VERSION in scripts/generate-prod-migration-script.sh.
#
# Bound to loopback only. Credentials are dev-only and intentionally committed.
services:
  mariadb:
    image: mariadb:11.8
    container_name: costco-receipts-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: dev_root_password
      MARIADB_DATABASE: costco_receipts
      MARIADB_USER: costco
      MARIADB_PASSWORD: dev_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      # Ships with the image; --innodb_initialized means "actually ready for
      # queries", not merely "accepting connections".
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
