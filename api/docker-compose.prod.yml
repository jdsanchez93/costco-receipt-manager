# For the Pi, at /opt/costco-api/ next to .env, migrator.env and deploy.env.
# MariaDB and cloudflared stay native on the host; only the API runs in
# Docker, with network_mode: host so it can reach MariaDB over the real
# loopback and cloudflared can reach it in turn.
#
# Driven by /usr/local/sbin/costco-deploy (api/deploy/costco-deploy.sh) rather
# than by hand. The image is a GHCR digest the script records in deploy.env,
# and its `--env-file deploy.env` is what supplies ${API_IMAGE} below — which
# also keeps .env's secrets out of variable interpolation. To pick up a
# changed .env: `sudo costco-deploy --recreate`.
#
# Copied to the Pi by hand, never by CI. See api/deploy/README.md.

# Pinned so the project is the same wherever the file lives; a second
# project would fight the running container for 127.0.0.1:8080.
name: costco-api

services:
  api:
    image: ${API_IMAGE:?set by costco-deploy, see api/deploy/README.md}
    network_mode: host
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # cloudflared's ingress (/etc/cloudflared/config.yml on the Pi)
      # points at 127.0.0.1:8080 — this must match, and so must
      # HEALTH_URL in costco-deploy.
      - Kestrel__Endpoints__Http__Url=http://127.0.0.1:8080
    env_file:
      - .env
