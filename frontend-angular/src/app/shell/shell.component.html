<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item
         routerLink="/app/receipts"
         routerLinkActive="active-link"
         (click)="closeIfMobile(drawer)">
        Receipts
      </a>
      <a mat-list-item
         routerLink="/app/contacts"
         routerLinkActive="active-link"
         (click)="closeIfMobile(drawer)">
        <span matListItemTitle>Contacts</span>
        @if (reviewCount(); as n) {
          <span matListItemMeta class="nav-count" [attr.aria-label]="n + ' to review'">{{ n }}</span>
        }
      </a>
      <a mat-list-item
         routerLink="/app/profile"
         routerLinkActive="active-link"
         (click)="closeIfMobile(drawer)">
        Profile
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button
          type="button"
          class="menu-button"
          [attr.aria-label]="reviewCount() ? 'Toggle sidenav, contacts to review' : 'Toggle sidenav'"
          matIconButton
          (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
          @if (reviewCount()) {
            <span class="menu-dot" aria-hidden="true"></span>
          }
        </button>
      }
      <span class="app-name">Costco Receipt Manager</span>
      <span class="spacer"></span>
      <button
        type="button"
        matIconButton
        aria-label="Log out"
        (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
