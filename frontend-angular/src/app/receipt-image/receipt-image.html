<div class="image">
  @let s = state();
  @switch (s.kind) {
    @case ('loading') {
      <div class="image__center"><mat-spinner diameter="32" /></div>
    }
    @case ('error') {
      <div class="image__info">
        <mat-icon>broken_image</mat-icon>
        <p>{{ s.message }}</p>
        <button mat-button (click)="load()">Retry</button>
      </div>
    }
    @case ('ok') {
      @if (loadFailed()) {
        <div class="image__info">
          <mat-icon>image_not_supported</mat-icon>
          <p>No receipt image available.</p>
        </div>
      } @else {
        <div class="image__frame" (click)="openFullscreen(s.data)">
          <img [src]="s.data" alt="Receipt image" (error)="onImageError()" />
          <button
            mat-icon-button
            class="image__fullscreen"
            aria-label="View fullscreen"
            (click)="$event.stopPropagation(); openFullscreen(s.data)">
            <mat-icon>fullscreen</mat-icon>
          </button>
        </div>
      }
    }
  }
</div>
