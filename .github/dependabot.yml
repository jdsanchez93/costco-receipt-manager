# Version updates for GitHub Actions only.
#
# Deliberately narrow. Actions are the one dependency class here that rots on a
# schedule rather than on demand: GitHub retires the Node runtime a major
# version targets, and a stale pin eventually stops working — which is exactly
# how all four of these ended up several majors behind. Library versions only
# matter when there is an advisory, and Dependabot *security* updates cover
# that. Those are a repository setting rather than this file, and they are on.
#
# An earlier version of this file also watched npm, nuget and docker. It opened
# 18 pull requests in a single run, for two reasons worth remembering: a group
# only captures the patterns it names, so everything unnamed still arrives
# individually; and Dependabot also bumps transitive lockfile entries, which
# produced six PRs for packages that are not even in a package.json. Fixing
# both would have cut it to about four — still more than this repository earns.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # One catch-all group, so this is always exactly one pull request.
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
